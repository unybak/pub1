name: Refresh rclone tokens

on:
    workflow_dispatch:
    # schedule:
    #     - cron: "15 8 */2 * *"

env:
    GH_TOKEN: ${{ secrets.UNY_AUTO_PAT }}
    RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

jobs:
    refresh-rclone-tokens:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Save variables to files
              run: |
                  echo "$GH_TOKEN" >GH_TOKEN
                  echo "$RCLONE_CONFIG" >RCLONE_CONFIG
                  echo "$GITHUB_REPOSITORY" >GITHUB_REPOSITORY
            - name: Run token refresh script
              run: |
                  chmod +x pub-refresh-rclone-tokens.bash
                  ./pub-refresh-rclone-tokens.bash \
                    --remote "OneDrive-m" \
                    --org "$(echo "$GITHUB_REPOSITORY" | grep -o "^[^/]*")""
