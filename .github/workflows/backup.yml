name: Backup
run-name: "Backing up: ${{ github.event.inputs.server }}"

on:
    workflow_dispatch:
        inputs:
            log_output:
                description: Show output?
                type: boolean
                required: true
                default: false
            server:
                description: Define server that a job should run on
                required: true
            code_repo:
                description: Code repository to use
                required: true
                default: unybak/unybak

env:
    GH_TOKEN: ${{ secrets.UNY_AUTO_PAT }}
    BAK_SSH_KEY: ${{ secrets.BAK_SSH_KEY }}
    RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
    HOSTYON_PASSPHRASE: ${{ secrets.HOSTYON_PASSPHRASE }}

jobs:
    backup:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Save variables to files
              run: |
                  echo "$GH_TOKEN" >GH_TOKEN
                  echo "$BAK_SSH_KEY" >BAK_SSH_KEY
                  echo "$RCLONE_CONFIG" >RCLONE_CONFIG
                  echo "$GITHUB_REPOSITORY" >GITHUB_REPOSITORY
                  echo "$HOSTYON_PASSPHRASE" >HOSTYON_PASSPHRASE
            - name: Run backup script
              run: |
                  log_output="${{ github.event.inputs.log_output }}"
                  export log_output
                  chmod +x pub-backup.bash
                  sudo ./pub-backup.bash ${{ github.event.inputs.server }} \
                    ${{ github.event.inputs.code_repo }}
