name: Backup
run-name: "Backing up: ${{ github.event.inputs.server }}"

on:
    workflow_dispatch:
        inputs:
            log_output:
                description: Show output?
                type: boolean
                required: true
                default: false
            server:
                description: Define server that a job should run on
                required: true
            code_repo:
                description: Code repository to use
                required: true
                default: unybak/code
            config_repo:
                description: ssh_config repository to use
                required: true
                default: unybak/ssh-config

env:
    GH_TOKEN: ${{ secrets.UNY_AUTO_PAT }}
    BAK_SSH_KEY: ${{ secrets.BAK_SSH_KEY }}
    RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
    HOSTYON_PASSPHRASE: ${{ secrets.HOSTYON_PASSPHRASE }}

jobs:
    backup:
        runs-on: ubuntu-latest
        steps:
            - name: Prepare workspace
              run: |
                  gh repo clone "${{ github.event.inputs.code_repo }}" code
                  gh repo clone "${{ github.event.inputs.config_repo }}" code/config

            - name: Run backup script
              working-directory: code
              run: |
                  log_output="${{ github.event.inputs.log_output }}"
                  export log_output
                  chmod +x backup.bash
                  sudo -E ./backup.bash "${{ github.event.inputs.server }}"
